<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>BUUMIA · Lockups</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0;}body{background:#1c1d24;color:#fff;font-family:Poppins,sans-serif;padding:24px 16px 60px;}

.sw img{max-width:94%;max-height:90%;}.white{background:#fff;}.navy{background:#001866;}

<h1>🐱 Logo BUUMIA — 4 opciones (gato izquierda · M azul)</h1>
<div class="sub">Dime el número que más te guste</div>
<div class="col"><div class="lbl">1 · BUUM / IA (con contorno)</div><div class="bgs"><div class="sw white"><img src="nuevos/lockup-1.png"></div><div class="sw navy"><img src="nuevos/lockup-1.png"></div></div><div class="tag">dos líneas, como pediste</div></div>
<div class="col"><div class="lbl">2 · BUU / MIA</div><div class="bgs"><div class="sw white"><img src="nuevos/lockup-2.png"></div><div class="sw navy"><img src="nuevos/lockup-2.png"></div></div><div class="tag">dos líneas, corte distinto</div></div>
<div class="col"><div class="lbl">3 · BUUMIA (una línea)</div><div class="bgs"><div class="sw white"><img src="nuevos/lockup-3.png"></div><div class="sw navy"><img src="nuevos/lockup-3.png"></div></div><div class="tag">horizontal completo</div></div>
<div class="col"><div class="lbl">4 · BUUM / IA (sin contorno, más limpio)</div><div class="bgs"><div class="sw white"><img src="nuevos/lockup-4.png"></div><div class="sw navy"><img src="nuevos/lockup-4.png"></div></div><div class="tag">más minimalista</div></div>
