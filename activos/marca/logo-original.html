<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>BUUM · Logo oficial (manual)</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0;}body{background:#11131a;color:#fff;font-family:Poppins,sans-serif;padding:26px 16px 60px;}
h1{font-size:22px;text-align:center;font-family:'Baloo 2';margin-bottom:4px;}.sub{text-align:center;color:#aab;font-size:13px;margin-bottom:24px;}
.row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;max-width:760px;margin:0 auto;}
.sw{width:220px;height:240px;border-radius:18px;display:flex;align-items:center;justify-content:center;padding:22px;box-shadow:0 12px 30px rgba(0,0,0,.4);}
.sw img{max-width:88%;max-height:88%;}
.white{background:#fff;}.cream{background:#f7e6d6;}.navy{background:#001866;}
.cap{text-align:center;font-size:12px;color:#99a;margin-top:8px;}
.pal{display:flex;gap:10px;justify-content:center;margin:26px auto 0;flex-wrap:wrap;}
.c{width:120px;height:70px;border-radius:12px;display:flex;align-items:flex-end;padding:8px;color:#fff;font-size:11px;font-weight:600;}
.note{text-align:center;color:#cdd3ee;font-size:13px;margin-top:20px;}
</style></head><body>
<h1>🐱 BUUM — Logo oficial del manual</h1>
<div class="sub">Apegado 100% al manual de identidad · este es el que vamos a usar</div>
<div class="row">
  <div><div class="sw white"><img src="logo-buum.png"></div><div class="cap">sobre blanco</div></div>
  <div><div class="sw cream"><img src="logo-buum.png"></div><div class="cap">sobre crema (fondo de marca)</div></div>
  <div><div class="sw navy"><img src="logo-buum.png"></div><div class="cap">sobre azul marino</div></div>
</div>
<div class="pal">
  <div class="c" style="background:#EA5003">#EA5003</div>
  <div class="c" style="background:#962D08">#962D08</div>
  <div class="c" style="background:#102AC4">#102AC4</div>
  <div class="c" style="background:#001866">#001866</div>
</div>
<div class="note">Mascota gato Kitsune + <b>BUUM</b> · fuentes Reglisse / Coolvetica / Gotham · colores oficiales arriba.</div>
</body></html>
