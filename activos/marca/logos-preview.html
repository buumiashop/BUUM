<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logos BUUMIA · preview</title>
<style>
body{margin:0;background:#0d0d16;color:#eef1f8;font-family:Arial,sans-serif;padding:24px;}
h1{font-size:21px;text-align:center;margin:0 0 4px;}
.sub{text-align:center;color:#9aa3c8;font-size:13px;margin-bottom:24px;}
.row{display:flex;flex-wrap:wrap;gap:26px;justify-content:center;margin-bottom:26px;}
.col{display:flex;flex-direction:column;align-items:center;gap:10px;}
.lbl{font-weight:bold;font-size:15px;}
.bgs{display:flex;gap:10px;}
.sw{width:150px;height:150px;border-radius:14px;display:flex;align-items:center;justify-content:center;}
.sw img{max-width:88%;max-height:88%;}
.white{background:#fff;} .cream{background:#f7e6d6;} .navy{background:#001866;}
.cap{font-size:11px;color:#8d96bd;text-align:center;}
</style></head>
<body>
<h1>🐱 Logo BUUMIA — 2 versiones</h1>
<div class="sub">Basadas en tu logo real · dicen BUUMIA · fondo transparente (se ven en cualquier color)</div>

<div class="row">
  <div class="col"><span class="lbl">A · Original (punto normal)</span>
    <div class="bgs">
      <div class="sw white"><img src="logo-buumia-original.png"></div>
      <div class="sw cream"><img src="logo-buumia-original.png"></div>
      <div class="sw navy"><img src="logo-buumia-original.png"></div>
    </div>
    <span class="cap">blanco · crema · azul marino</span>
  </div>

  <div class="col"><span class="lbl">B · Robot 🤖 (la "i" tipo IA)</span>
    <div class="bgs">
      <div class="sw white"><img src="logo-buumia-robot.png"></div>
      <div class="sw cream"><img src="logo-buumia-robot.png"></div>
      <div class="sw navy"><img src="logo-buumia-robot.png"></div>
    </div>
    <span class="cap">blanco · crema · azul marino</span>
  </div>
</div>
</body></html>
