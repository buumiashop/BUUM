<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>BUUMIA · Logos nuevos</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0;}body{background:#1c1d24;color:#fff;font-family:Poppins,sans-serif;padding:24px 16px 60px;}
h1{font-size:21px;text-align:center;font-family:'Baloo 2';margin-bottom:4px;}.sub{text-align:center;color:#aab;font-size:13px;margin-bottom:24px;}
.row{display:flex;flex-wrap:wrap;gap:24px;justify-content:center;}
.col{width:260px;}.lbl{font-weight:bold;font-size:15px;margin-bottom:8px;text-align:center;}
.bgs{display:flex;gap:10px;}.sw{flex:1;height:150px;border-radius:14px;display:flex;align-items:center;justify-content:center;padding:12px;}
.sw img{max-width:90%;max-height:90%;}.white{background:#fff;}.navy{background:#001866;}
.tag{font-size:11px;text-align:center;margin-top:8px;}.new{color:#5fe0ad;}.old{color:#ff8a8a;}
</style></head><body>
<h1>🐱 Logo BUUMIA — actual vs nuevos</h1>
<div class="sub">Todos dicen BUUMIA correcto · dime cuál te gusta</div>
<div class="row">
  <div class="col"><div class="lbl">Actual (el de ahora)</div><div class="bgs"><div class="sw white"><img src="logo-buumia-original.png"></div><div class="sw navy"><img src="logo-buumia-original.png"></div></div><div class="tag old">✗ el que quieres cambiar</div></div>
  <div class="col"><div class="lbl">Nuevo A · Apilado</div><div class="bgs"><div class="sw white"><img src="nuevos/compuesto-oficial.png"></div><div class="sw navy"><img src="nuevos/compuesto-oficial.png"></div></div><div class="tag new">✓ gato nítido + letras limpias</div></div>
  <div class="col"><div class="lbl">Nuevo B · Horizontal</div><div class="bgs"><div class="sw white"><img src="nuevos/nuevo-4-horizontal.png"></div><div class="sw navy"><img src="nuevos/nuevo-4-horizontal.png"></div></div><div class="tag new">✓ moderno, gato a la izquierda</div></div>
</div>
</body></html>
